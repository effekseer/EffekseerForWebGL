name: webgl-emsdk-1.38.11

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - 15x
      - 16x
      - 17x
  pull_request:
    branches:
      - master
      - main
      - 15x
      - 16x
      - 17x

jobs:
  build:
    name: Build WebGL (emsdk 1.38.11)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Initialize submodules
        run: git submodule update --init --depth 1

      # Legacy fastcomp requires CMake's pre-4.0 compatibility policies.
      - name: Install CMake 3.31.6
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake"
          "$RUNNER_TEMP/cmake/bin/python" -m pip install cmake==3.31.6
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"

      - name: Cache emsdk
        id: cache
        uses: actions/cache@v4
        with:
          path: ./emsdk
          key: ${{ runner.os }}-ubuntu-24.04-emsdk-1_38_11-cmake-3.31.6-v2

      - name: Install emsdk 1.38.11
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git -b 3.1.19 --depth 1
          cd emsdk
          ./emsdk install sdk-fastcomp-tag-1.38.11-64bit

      - name: Build
        run: bash scripts/build_emsdk_1_38_11.sh

      - name: Upload Release
        uses: actions/upload-artifact@v4
        with:
          name: Release-emsdk-1.38.11
          path: Release
